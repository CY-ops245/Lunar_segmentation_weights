name: Build Docker Tar

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像
        run: |
          docker build -f docker/Dockerfile -t lunar-seg-app:v1 .

      - name: 将镜像导出为 tar 文件
        run: |
          docker save lunar-seg-app:v1 -o lunar_seg_submission.zip

      - name: 上传打包好的 tar 文件作为构件
        uses: actions/upload-artifact@v4
        with:
          name: lunar_seg_submission
          path: lunar_seg_submission.zip
